name: CI

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:        # déclenchement manuel (bouton "Run workflow")

# SÉCURITÉ : permissions minimales — lecture seule par défaut.
permissions:
  contents: read

# Annule les runs obsolètes sur la même branche/PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run ruff
        run: poetry run ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Run tests
        run: poetry run pytest tests/ -v

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install poetry
        run: pip install poetry
      - name: Install dependencies
        run: poetry install --no-interaction
      - name: Build package
        run: poetry build

  # TODO angle-i : a faire au PROCHAIN bump, pas avant.
  # Ajouter, AVANT `poetry build`, une verification des versions :
  #   1) version du tag = ${GITHUB_REF#refs/tags/v}
  #   2) pyproject.toml = `poetry version --short`
  #   3) __init__.py    = __version__ dans
  #      src/password_generator_advanced/__init__.py
  # Si une des trois ne concorde pas : exit 1 (alarme qui bloque).
  # Decision : option "Verifier", on GARDE __version__.
  # Le controle doit ECHOUER (exit 1) hors tag, PAS se taire
  # (donc pas de `if:` qui saute silencieusement).
  # Contexte et "pourquoi plus tard" : voir note angle-i.
  release:
    runs-on: ubuntu-latest
    # Publication uniquement sur push de tag v*.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [lint, test, build]
    permissions:
      contents: read
      id-token: write          # requis pour OIDC Trusted Publishing
    environment: release       # lié au Trusted Publisher PyPI
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Install poetry
        run: pip install poetry
      - name: Build package
        run: poetry build
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
